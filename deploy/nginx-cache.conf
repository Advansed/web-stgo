# Подключите в server { ... } для сайта, например:
# include /var/www/html/nginx-cache.conf;
# или скопируйте блоки ниже в конфиг сайта и сделайте: nginx -t && systemctl reload nginx

# HTML и манифест — всегда проверять свежесть
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

location = /manifest.json {
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# Сборка Vite: /assets/index-XXXX.js — можно кэшировать надолго
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# SPA fallback
location / {
    try_files $uri $uri/ /index.html;
}
